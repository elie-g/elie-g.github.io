        <text style="font-weight: 800; font-size: 16px; transform-box: fill-box; transform-origin: 50% 100%; transform: rotate(180deg); white-space: pre;" x="231" y="290">✓</text>
        <text class="letter" style="font-size: 30px; white-space: pre;" x="226" y="270">B</text>
        <animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines=".5 .1 .5 1; .5 0 .5 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 30;0 0" dur="17s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines=".5 .1 .5 1; .5 0 .5 1"/>
      </g>
